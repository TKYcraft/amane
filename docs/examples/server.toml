# amane リレーサーバ設定例 (Rocky Linux 等 / グローバルIP保有)
[server]
listen           = "0.0.0.0:51820"
private_key_file = "/etc/amane/server.key"   # amane genkey で生成
tunnel_address   = "10.77.0.1/24"
# mtu = WAN経路MTUの最小値 - 68。既定1400はWAN MTU>=1468前提。
# 例: サーバ回線のMTUが1460なら 1460-68 = 1392(クライアントと同じ値にする)
# mtu            = 1392
# 外側UDPパケットの DiffServ マーキング。クライアント側と独立に設定可能。
# 既定は be(無マーキング)。各値の意味・用途はクライアント側 client.toml の
# 同項目コメントを参照(ef=VoIP準拠, af41=インタラクティブ映像, cs1=スカベンジャ等)。
# dscp           = "ef"
# control_socket = "/var/run/amane.sock"

[server.nat]
enabled       = true      # ip_forward + nftables masquerade + MSSクランプを自動投入
out_interface = "eth0"    # インターネット側インターフェース

# 許可するクライアント(公開鍵認証)。1台につき1ブロック。
[[peer]]
name       = "field-unit-1"
public_key = "REPLACE_WITH_CLIENT_PUBLIC_KEY"
tunnel_ip  = "10.77.0.2"
# preshared_key_file = "/etc/amane/psk-unit1"   # 任意の追加PSK

# [[peer]]
# name       = "field-unit-2"
# public_key = "..."
# tunnel_ip  = "10.77.0.3"

# チューニング(すべて省略可、既定値を表示)。クライアント側と独立に設定可能。
# [tuning]
# probe_interval_ms    = 200      # プローブ/キープアライブ間隔
# max_reorder_delay_ms = 100      # リオーダ待ちの上限
# dead_interval_probes = 5        # この回数分無応答でパスをdown判定
# degrade_loss_pct     = 10       # このロス率超過が持続するとdegraded
# degrade_rtt_ms       = 1000
# rekey_seconds        = 120      # 鍵ローテーション周期
# notify_too_big       = true     # ダウンリンクで大きすぎる内側パケットを
                                  # どのパスにも乗せられないときに ICMP Frag Needed
                                  # を内側TCPへ返す(PMTUブラックホール対策、既定有効)
