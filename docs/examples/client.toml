# amane クライアント設定例 (macOS PC / Linux ルーター)
[client]
private_key_file  = "/etc/amane/client.key"      # amane genkey で生成
server            = "relay.example.com:51820"
server_public_key = "REPLACE_WITH_SERVER_PUBLIC_KEY"
tunnel_address    = "10.77.0.2/24"
mode              = "bonding"                     # bonding | redundant | fec
# mtu = WAN経路MTUの最小値 - 68(サーバ側と同じ値にする)。例: 1460回線なら1392
# mtu             = 1392
# 外側UDPパケットの DiffServ マーキング(IPヘッダTOSバイト上位6bit)。
# 経路(ルータ/ISP)が尊重する場合のみ効果が出る。モバイル網はほぼ無視、
# 自宅ルータや法人閉域・一部ISPでは効くことがある。Discord の「高いパケット
# 優先度を有効化」と同じ機構・同じ限界。既定 be(=無マーキング=0)。
#
# 代表的な値(RFC 2474/4594、カッコ内は実際にTOSに乗る 10進DSCP):
#   be / cs0     = Best Effort。無指定と同じ、既定 (0)
#   ef           = Expedited Forwarding。最低遅延/最低ロス待遇、VoIP の
#                  標準値。Discord など多くのリアルタイム通信が選ぶ (46)
#   af41         = Assured Forwarding クラス4-1、インタラクティブ映像想定。
#                  EFよりドロップ耐性寄り、帯域を取りやすい。SRTや業務
#                  ライブ配信向き (34)
#   af42 / af43  = 同クラス、輻輳時のドロップ優先度が1段/2段上がる (36/38)
#   af31         = 放送映像(非対話)。マルチキャスト配信向き (26)
#   af21         = 低遅延データ(短トランザクション) (18)
#   af11         = 高スループット・遅延許容(大容量転送) (10)
#   cs1          = Lower-than-BE / Scavenger。「空いた帯域を拾う」用途、
#                  バックアップ・バックグラウンド同期向け (8)
#   cs4          = Realtime Interactive。AF41の前身、古い機器では AF41 の
#                  代わりに尊重されることがある (32)
#   cs5          = 放送映像(旧式。AF3x相当) (40)
#   cs6 / cs7    = Network Control(OSPF等のルータ間制御専用)。ユーザ
#                  アプリでの使用は非推奨、ISPに弾かれやすい (48/56)
#   voice-admit  = VoIP admission control (RFC 5865) (44)
# 整数(0..63)での直接指定も可。
#
# amane のライブ配信用途は ef か af41 のいずれかが順当。
# 法人閉域で DSCP ポリシーが決まっている場合はその指示に従うこと。
# dscp            = "ef"
# routes: トンネルに向ける宛先。
#   省略(推奨・配信用途) = トンネルサブネットのみ。OBS等は srt://10.77.0.1:... へ送る
#   ["0.0.0.0/0"] = 全トラフィック(/1+/1分割ルート。amane自身はIFバインドで除外される)
# routes          = ["0.0.0.0/0"]
# preshared_key_file = "/etc/amane/psk"
# control_socket  = "/var/run/amane.sock"

[links]
auto    = true                    # 使えるWANインターフェースを自動検出
exclude = ["utun*", "awdl*", "llw*", "bridge*", "docker*", "veth*"]

# 明示指定(auto と併用可。initial_mbps は帯域の初期ヒント)
# [[links.link]]
# interface   = "en10"            # LTEドングル1
# initial_mbps = 30
#
# [[links.link]]
# interface   = "en12"            # LTEドングル2

# FECモード(mode = "fec")のチューニング(すべて省略可、既定値を表示)
# [fec]
# group    = 10   # グループあたりのデータパケット数 K (2..15)
# parity   = 0    # パリティ数 R。0 = ロス率から自動 (1 + round(K×2×loss)、上限4)
# flush_ms = 8    # K個貯まらなくてもこの時間でグループを締める(遅延上限)

# チューニング(すべて省略可、既定値を表示)
# [tuning]
# probe_interval_ms    = 200      # プローブ/キープアライブ間隔
# max_reorder_delay_ms = 100      # リオーダ待ちの上限(ライブ配信は小さく)
# dead_interval_probes = 5        # この回数分無応答でパスをdown判定
# degrade_loss_pct     = 10       # このロス率超過が持続するとdegraded
# degrade_rtt_ms       = 1000
# rekey_seconds        = 120      # 鍵ローテーション周期
# notify_too_big       = true     # 大きすぎる内側パケットをどのパスにも乗せられない
                                  # ときに ICMP Frag Needed / Packet Too Big を内側TCPへ
                                  # 返す(PMTUブラックホール対策、既定有効)
